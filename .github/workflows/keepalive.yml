# Render's free tier puts the backend to sleep after ~15 idle minutes; the first visitor then waits up to a minute
# (and, before the frontend fix, could not log in or sign up at all). A ping every 10 minutes keeps it awake.
# One always-on free service fits in Render's 750 free instance-hours a month.
name: Keep backend awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 --retry 2 https://gkmentor.onrender.com/auth/config
