<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GK Admin</title>
__CSS__
<style>
textarea,input[type=text],input[type=date]{width:100%;background:var(--p);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font:inherit;outline:0}
textarea{min-height:90px;resize:vertical}textarea:focus,input:focus{border-color:var(--am)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}@media(max-width:900px){.cols{grid-template-columns:1fr}}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn.r{background:#3b1414;color:var(--bd)}.pill.r{background:#3b1414;color:var(--bd)}
.panel{margin-bottom:16px}.panel h3{margin:0 0 6px}.line{padding:6px 0;border-bottom:1px solid var(--ln);font-size:13px}.line a{color:var(--am);overflow-wrap:anywhere;word-break:break-all}.cols>div{min-width:0}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.lens{display:inline-block;margin:4px 12px 4px 0;color:var(--mu);font-size:13px}.msg{color:var(--gn);margin-top:10px}
</style></head><body>
<header><div class="hd"><div><h1>GK Admin</h1><p>Review AI notes, write editorials and manage GK content. Secured by GK_ADMIN_PASSWORD.</p></div><a class="btn" href="/" target="_blank">View live site →</a></div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let KEY=sessionStorage.getItem('k')||'';const A={rates:[],sst:'pending',sc:[],si:[],sdue:[],cat:'',gst:'pending',gds:[],tab:'review',status:'pending',route:'all',ed:null,meta:{lenses:{}},msg:''};
async function api(p,b,retry){const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','X-Admin-Key':KEY},body:b?JSON.stringify(b):undefined});
if(r.status===401&&!retry){KEY=prompt('Admin password')||'';sessionStorage.setItem('k',KEY);return api(p,b,1)}return r.json()}
const sel=(id,cur,opts,fn)=>`<select onchange="${fn}(this.value)">${opts.map(o=>`<option ${o===cur?'selected':''}>${o}</option>`).join('')}</select>`;
const T=[['review','Review queue'],['gd','GD Topics'],['static','Static GK'],['editorials','Editorials'],['publish','Publish / Live Feeds']];
function nav(){$('nav').innerHTML=T.map(t=>`<a class="${A.tab===t[0]?'on':''}" onclick="A.tab='${t[0]}';A.msg='';load()">${t[1]}</a>`).join('')}
async function load(){nav();A.meta=await api('/api/meta');
if(A.tab==='review'){A.notes=await api(`/api/notes?status=${A.status}&route=${A.route}`);}
if(A.tab==='editorials'){A.eds=await api('/api/editorials')}
if(A.tab==='gd'){A.gds=await api('/api/gd?status='+A.gst)}
if(A.tab==='static'){A.sc=await api('/api/static/cats');if(!A.cat||!A.sc.find(c=>c.slug===A.cat))A.cat=A.sc[0].slug;A.si=await api(`/api/static/items?cat=${A.cat}&status=${A.sst}`);A.sdue=await api('/api/static/due');A.rates=await api('/api/static/rates')}draw()}
function draw(){const v={review:vReview,gd:vGd,static:vStatic,editorials:vEd,publish:vPub}[A.tab]();$('app').innerHTML=v}
function vReview(){const m=A.meta.counts||{};
const side=`<aside><label>Status</label>${sel('s',A.status,['pending','approved','rejected','auto_published'],'setS')}<label>Route</label>${sel('r',A.route,['all','deep_review','quick_review','auto'],'setR')}<p class="side-note">pending: ${m.pending||0} · approved: ${m.approved||0} · rejected: ${m.rejected||0}</p><p class="side-note">Deep review = a claim could not be matched to its source. Check those first.</p></aside>`;
return `<div class="lay">${side}<section class="main"><h2>${A.status} notes<small>${A.notes.length}</small></h2>${A.notes.map(note).join('')||'<p class="mu">Nothing here.</p>'}</section></div>`}
const setS=v=>{A.status=v;load()},setR=v=>{A.route=v;load()};
function note(n){return `<div class="panel"><div class="tags" style="margin-bottom:8px"><span class="pill">${esc(n.route||'-')}</span><span class="pill n">${esc(n.sector)}</span><span class="pill n">${n.importance}</span><span class="pill n">${n.day}</span></div>
<div class="cols"><div><b>Sources</b>${n.sources.map(u=>`<div class="line"><a href="${esc(u)}" target="_blank" rel="noopener" title="${esc(u)}">${esc(u.replace(/^https?:\/\//,'').slice(0,60))}${u.length>66?'…':''} ↗</a></div>`).join('')}
<p><b>Claims</b></p>${n.claims.map(c=>`<div class="line"><span class="pill ${c.grounded?'':'r'}">${c.grounded?'OK':'NOT GROUNDED'}</span> ${esc(c.kind)} · ${esc(c.text)}</div>`).join('')}
<p><b>Questions</b></p>${n.questions.map(q=>`<div class="line">${esc(q.q)} → <b>${esc(q.options[q.answer])}</b> <span class="pill ${q.valid&&q.solver_ok?'n':'r'}">${q.valid&&q.solver_ok?'solver agrees':'check'}</span> <span class="pill n">${q.status}</span>
<a href="#" onclick="qs(${q.id},'approved');return false">approve</a> · <a href="#" onclick="qs(${q.id},'rejected');return false">reject</a></div>`).join('')}</div>
<div><label>Headline</label><input type="text" id="h${n.id}" value="${esc(n.headline)}"><label>Bullets (one per line)</label><textarea id="b${n.id}" rows="6">${esc(n.bullets.join('\n'))}</textarea><label>Exam angle</label><textarea id="a${n.id}">${esc(n.exam_angle)}</textarea>
<div class="acts"><button class="btn" onclick="act(${n.id},'approve')">Approve</button><button class="btn g" onclick="act(${n.id},'save')">Save edits</button><button class="btn r" onclick="act(${n.id},'reject')">Reject</button><button class="btn g" onclick="act(${n.id},'pending')">Back to pending</button></div></div></div></div>`}
async function act(id,action){await api('/api/note',{id,action,headline:$('h'+id).value,bullets:$('b'+id).value.split('\n').filter(x=>x.trim()),exam_angle:$('a'+id).value});load()}
async function qs(id,status){await api('/api/question',{id,status});load()}
function vEd(){const L=A.meta.lenses,e=A.ed||{id:0,title:'',body_md:'',day:(t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'))(new Date()),lenses:[],status:'draft'};
return `<div class="lay"><aside><p class="side-note">Editorials are written by you and never touched by the AI. Only <b>published</b> ones appear on the site, in the daily, weekly and monthly views. No exam ticked = shown for every exam.</p></aside><section class="main">${aiPanel()}<h2>${e.id?'Edit editorial':'New editorial'}</h2><div class="panel" style="max-width:820px">
${e.source==='ai-draft'&&e.status!=='published'?`<div class="err">AI draft: verify every fact${e.flags?` (numbers not found in your notes: ${esc(e.flags)})`:''}, then edit and publish.</div>`:''}<label>Title</label><input type="text" id="et" value="${esc(e.title)}"><label>Date</label><input type="date" id="ed" value="${e.day}"><label>Show for exams</label>${Object.keys(L).map(k=>`<span class="lens"><input type="checkbox" class="el" value="${k}" ${e.lenses.includes(k)?'checked':''}> ${esc(L[k])}</span>`).join('')}
<label>Body (Markdown: blank line = new paragraph, "- " = bullet, **bold**)</label><textarea id="eb" rows="12">${esc(e.body_md)}</textarea>
<div class="acts"><button class="btn" onclick="saveEd('published')">Save &amp; publish</button><button class="btn g" onclick="saveEd('draft')">Save as draft</button>${e.id?`<button class="btn g" onclick="A.ed=null;draw()">New</button>`:''}</div><div class="msg">${esc(A.msg)}</div></div>
<h2>All editorials<small>${A.eds.length}</small></h2>${A.eds.map(x=>`<div class="panel"><div class="tags"><span class="pill ${x.status==='published'?'':'n'}">${x.status}</span><span class="pill n">${x.day}</span>${x.source==='ai-draft'&&x.status!=='published'?'<span class="pill r">AI draft: verify facts</span>':''}</div><h3>${esc(x.title)}</h3>${x.source==='ai-draft'&&x.flags&&x.status!=='published'?`<div class="err">Numbers not found in your notes: ${esc(x.flags)}</div>`:''}
<div class="acts"><button class="btn g" onclick="editEd(${x.id})">Edit</button><button class="btn g" onclick="setEd(${x.id},'${x.status==='published'?'draft':'published'}')">${x.status==='published'?'Unpublish':'Publish'}</button><button class="btn r" onclick="delEd(${x.id})">Delete</button></div></div>`).join('')}</section></div>`}
const aiPanel=()=>`<div class="panel" style="max-width:820px"><div class="tags" style="margin-bottom:8px"><span class="pill">Draft with AI</span></div><label>Topic or angle</label><input type="text" id="edt" value="${esc(A.et||'')}" placeholder="e.g. Why the RBI rate decision matters for farm loans"><label>Notes or facts to include (optional)</label><textarea id="edx" rows="3">${esc(A.ex||'')}</textarea><div class="acts"><button class="btn" onclick="draftEd()">Draft editorial with AI</button></div><div class="msg">${esc(A.aim||'')}</div></div>`;
async function draftEd(){const t=$('edt').value.trim();if(!t){alert('Type a topic first.');return}A.et=t;A.ex=$('edx').value;A.aim='Drafting (about a minute)...';draw();const r=await api('/api/editorial/draft',{topic:t,extra:A.ex});if(r.error){A.aim=r.error}else{A.aim='Draft created below (unpublished). Click Edit on it, review, then publish.';A.et=A.ex=''}A.eds=await api('/api/editorials');draw()}
async function saveEd(status){const r=await api('/api/editorial',{action:'save',id:A.ed?A.ed.id:0,title:$('et').value,day:$('ed').value,body_md:$('eb').value,status,lenses:[...document.querySelectorAll('.el:checked')].map(x=>x.value)});
if(r.error){A.msg=r.error}else{A.msg='Saved.';A.ed=null}A.eds=await api('/api/editorials');draw()}
const editEd=id=>{A.ed=A.eds.find(x=>x.id===id);A.msg='';draw()};
async function setEd(id,status){await api('/api/editorial',{action:'status',id,status});load()}
async function delEd(id){if(confirm('Delete this editorial permanently?')){await api('/api/editorial',{action:'delete',id});A.ed=null;load()}}
function vPub(){const m=A.meta.counts||{};return `<div class="single"><h2>Publish &amp; Feed Management</h2><div class="panel"><div class="stats"><div class="stat"><b>${m.approved||0}</b><span>approved notes</span></div><div class="stat"><b>${m.published_editorials||0}</b><span>published editorials</span></div><div class="stat"><b>${m.pending||0}</b><span>still pending</span></div></div>
<p class="mu">The hosted app serves live content directly from the database to your Vercel frontend. Approving notes, adding static items, or publishing editorials reflects immediately. You can also trigger the daily pipeline right now to ingest and process today's news feeds from PIB, The Hindu, etc.</p>
<div class="acts"><button class="btn" onclick="fetchDaily()">Trigger Today's News Feed Fetch</button><button class="btn g" onclick="build()">Export site bundle</button><a class="btn g" href="/" target="_blank">Open site →</a></div><div class="msg">${esc(A.msg)}</div></div></div>`}
async function fetchDaily(){if(!confirm("Fetch and ingest today's feeds now? This can take 1-2 minutes depending on source volume.")){return}A.msg='Fetching daily feeds and running pipeline... please wait...';draw();const r=await api('/api/admin/fetch-daily',{});if(r.error){A.msg='Error: '+r.error}else{A.msg=`Fetch complete for ${r.day}. Check the Review Queue tab!`}load()}
const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean),setG=v=>{A.gst=v;load()};
function gdCard(g){const i=g.id,ta=(k,l,v,r)=>`<label>${l}</label><textarea id="${k}${i}" rows="${r||3}">${esc(v)}</textarea>`;
const rest=`${ta('gc','Context',g.context,2)}<div class="cols"><div>${ta('gf','For (one per line)',g.for_points.join('\n'),6)}</div><div>${ta('ga','Against (one per line)',g.against_points.join('\n'),6)}</div></div>${ta('gk','Key facts to quote (one per line)',g.key_facts.join('\n'),3)}${ta('go','Open with',g.opening,2)}${ta('gn','Close with',g.conclusion,2)}`;
if(!i)return `<div class="panel"><div class="tags" style="margin-bottom:8px"><span class="pill">Suggest a topic</span></div><label>Topic</label><input type="text" id="gt0" value="${esc(A.t0||'')}" placeholder="e.g. Should India adopt a four-day work week?">${ta('gx','Notes or facts to include (optional)',A.x0||'',3)}<div class="acts"><button class="btn" onclick="gdFromTopic()">Generate GD with AI</button></div><div class="side-note">${esc(A.msg)}</div><details style="margin-top:14px"><summary class="mu" style="cursor:pointer">Or write the whole GD yourself</summary>${rest}<div class="acts"><button class="btn g" onclick="gdAct(0,'create')">Add &amp; publish</button></div></details></div>`;
return `<div class="panel"><div class="tags" style="margin-bottom:8px"><span class="pill n">${esc(g.sector)}</span><span class="pill n">${g.day}</span><span class="pill n">${g.status}</span>${g.source==='admin-topic'?'<span class="pill r">AI-written from your topic: verify facts</span>':''}</div><label>Topic</label><input type="text" id="gt${i}" value="${esc(g.topic)}">${rest}
<div class="acts"><button class="btn" onclick="gdAct(${i},'approve')">Approve</button><button class="btn g" onclick="gdAct(${i},'save')">Save edits</button><button class="btn r" onclick="gdAct(${i},'reject')">Reject</button><button class="btn g" onclick="gdAct(${i},'pending')">Back to pending</button><button class="btn r" onclick="if(confirm('Delete permanently?'))gdAct(${i},'delete')">Delete</button></div></div>`}
async function gdFromTopic(){const t=$('gt0').value.trim();if(!t){alert('Type a topic first.');return}A.t0=t;A.x0=$('gx0').value;A.msg='Generating (about a minute)...';draw();
const r=await api('/api/gd/from-topic',{topic:t,extra:A.x0});if(r.error){A.msg=r.error}else{A.msg='Created. Review it below, then approve.';A.t0=A.x0='';A.gst='pending'}load()}
async function gdAct(id,action){const f=k=>$(k+id).value;const r=await api('/api/gd',{id,action,topic:f('gt'),context:f('gc'),for_points:lines(f('gf')),against_points:lines(f('ga')),key_facts:lines(f('gk')),opening:f('go'),conclusion:f('gn')});if(r.error)alert(r.error);load()}
async function genGd(){A.msg='Generating (can take a minute)...';draw();const r=await api('/api/gd/generate',{});A.msg=r.error||`Created ${r.made} topic(s). They are pending: review and approve.`;A.gst='pending';load()}
function vGd(){return `<div class="lay"><aside><label>Status</label>${sel('g',A.gst,['pending','approved','rejected'],'setG')}<button class="go" onclick="genGd()">Generate from approved notes</button><div class="side-note">${esc(A.msg)}</div><p class="side-note">Type your own topic at the top and click Generate GD with AI, or use the button above to draft up to 3 topics from your approved High/Medium notes. Everything starts as pending: review, edit, then approve.</p></aside><section class="main"><h2>GD topics<small>${A.gds.length}</small></h2>${gdCard({id:0,topic:'',context:'',for_points:[],against_points:[],key_facts:[],opening:'',conclusion:''})}${A.gds.map(gdCard).join('')}</section></div>`}
const LONG=['definition','example','why_it_matters','related','subject','about','description','functions','importance','background','why_known','major_decisions','purpose'],today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const lab=k=>k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const sfld=(p,k,v)=>`<div><label>${lab(k)}</label>${LONG.includes(k)?`<textarea id="${p}_${k}" rows="2">${esc(v||'')}</textarea>`:`<input type="text" id="${p}_${k}" value="${esc(v||'')}">`}</div>`;
const sextra=(p,it)=>`<div><label>Source (where you checked it)</label><input type="text" id="${p}_source" value="${esc(it.source||'')}"></div><div><label>As on (date checked)</label><input type="date" id="${p}_as_on" value="${it.as_on||today()}"></div><div><label>How often it changes</label><select id="${p}_vol">${['stable','yearly','volatile'].map(x=>`<option ${x===it.volatility?'selected':''}>${x}</option>`).join('')}</select></div>`;
const setSs=v=>{A.sst=v;load()};
function sCard(cat,it){const p='i'+it.id;return `<div class="panel"><div class="tags" style="margin-bottom:8px"><span class="pill ${it.status==='approved'?'':'n'}">${it.status}</span><span class="pill n">${it.volatility}</span><span class="pill n">review by ${it.review_due}</span>${it.source&&it.source.startsWith('Starter')?'<span class="pill r">starter set: verify</span>':''}</div>
<div class="fg">${cat.columns.map(k=>sfld(p,k,it.data[k])).join('')}${sextra(p,it)}</div>
<div class="acts"><button class="btn" onclick="stAct(${it.id},'approve')">Approve</button><button class="btn g" onclick="stAct(${it.id},'save')">Save edits</button><button class="btn r" onclick="stAct(${it.id},'reject')">Reject</button><button class="btn g" onclick="stAct(${it.id},'pending')">Back to pending</button><button class="btn g" onclick="stHist(${it.id})">History</button><button class="btn r" onclick="if(confirm('Delete permanently?'))stAct(${it.id},'delete')">Delete</button></div></div>`}
function vStatic(){const cat=A.sc.find(c=>c.slug===A.cat)||{columns:[],name:'',counts:{}};
const side=`<aside><label>Category</label><select onchange="A.cat=this.value;load()">${A.sc.map(c=>`<option value="${c.slug}" ${c.slug===A.cat?'selected':''}>${esc(c.name)} (${c.counts.approved||0} live, ${c.counts.pending||0} pending)</option>`).join('')}</select><label>Show</label>${sel('s',A.sst,['pending','approved','rejected'],'setSs')}
<button class="go" onclick="stApproveAll()">Approve all pending here</button><button class="btn g" style="width:100%;margin-top:10px" onclick="stSeed()">Load starter set (as pending)</button><button class="btn" style="width:100%;margin-top:10px" onclick="stFill()">AI: fill the next batch of ALL sections</button><div class="side-note">${esc(A.msg)}</div><p class="side-note">Entries due for a re-check: <b>${A.sdue.length}</b>. Approved entries stay on the site until you change them; every change is kept in History.</p></aside>`;
const due=A.sdue.length?`<details class="panel"><summary class="mu" style="cursor:pointer">Due for review (${A.sdue.length})</summary>${A.sdue.slice(0,50).map(d=>`<div class="line"><b>${esc(d.cat_name)}</b>: ${esc(Object.values(d.data)[0])} <span class="mu">(as on ${d.as_on}, due ${d.review_due})</span></div>`).join('')}<p class="mu">Open the category, check the official source, edit if needed, set "As on" to today and click Save edits.</p></details>`:'';
const add=`<div class="panel"><div class="tags" style="margin-bottom:8px"><span class="pill">Add to ${esc(cat.name)}</span></div><div class="fg">${cat.columns.map(k=>sfld('n0',k,'')).join('')}${sextra('n0',{})}</div><div class="acts"><button class="btn" onclick="stAct(0,'create_approved')">Add &amp; publish</button><button class="btn g" onclick="stAct(0,'create_pending')">Add as pending</button></div></div>
<details class="panel"><summary class="mu" style="cursor:pointer">Import many rows from a CSV file</summary><p class="mu">First row = column names: <code>${cat.columns.join(', ')}</code>. Entries that already exist are skipped.</p><input type="file" accept=".csv,text/csv" onchange="stFile(this)"><textarea id="csv" rows="5" placeholder="Or paste CSV text here"></textarea><div class="acts"><button class="btn g" onclick="stImport(false)">Import as pending</button><button class="btn" onclick="stImport(true)">Import &amp; publish</button></div></details>
<details class="panel"><summary class="mu" style="cursor:pointer">Create a new category</summary><label>Name</label><input type="text" id="nc_name"><label>Type</label><select id="nc_kind"><option>table</option><option>glossary</option></select><label>Columns (comma separated; the first one identifies the row; ignored for glossary)</label><input type="text" id="nc_cols" placeholder="e.g. river, origin, mouth"><div class="acts"><button class="btn" onclick="stNewCat()">Create category</button></div></details>`;
const ai=`<details class="panel"><summary class="mu" style="cursor:pointer">AI help: draft entries for ${esc(cat.name)}</summary>
${cat.knowledge_ok?`<p class="mu">Drafts stable facts from the AI's general knowledge as <b>pending</b> entries tagged "verify". Check each one before approving.</p><label>Focus</label><select id="ai_hint">${(cat.hints||[]).map(h=>`<option>${esc(h)}</option>`).join('')}</select><label>How many (max 40)</label><input type="text" id="ai_n" value="25"><div class="acts"><button class="btn" onclick="stDraft('knowledge')">Draft from AI knowledge</button></div>`:`<p class="mu">This category changes often (or holds yearly ranks), so the AI may not write it from memory. Paste the official text below instead.</p>`}
<label>Or paste an OFFICIAL text (report, ministers list...) to extract rows from</label><textarea id="ai_text" rows="5"></textarea><label>Source link (optional)</label><input type="text" id="ai_url"><div class="acts"><button class="btn g" onclick="stDraft('text')">Extract from this text</button></div><div class="side-note">Rows whose key or numbers are not in your text are dropped automatically.</div></details>`;
const rt=cat.slug==='banking-terms'?`<details class="panel" ${A.rates.some(r=>r.status==='pending')?'open':''}><summary class="mu" style="cursor:pointer">Policy rates: automatic updates from RBI statements (${A.rates.length})</summary>
<p class="mu">After each RBI announcement the system reads the official statement and updates the current values. It applies a rate automatically only when the RBI's own sentence is found and the rates agree with each other; otherwise it waits for you here.</p>
${A.rates.slice(0,15).map(r=>`<div class="line"><span class="pill ${r.status==='applied'?'':r.status==='pending'?'r':'n'}">${r.status}</span> <b>${esc(r.term)}</b>: ${esc(r.old_value||'(none)')} → <b>${esc(r.new_value)}</b> <span class="mu">as on ${esc(r.as_on)}</span> ${r.source_url&&r.source_url.startsWith('http')?`<a href="${esc(r.source_url)}" target="_blank" rel="noopener">source</a>`:''}${r.reason?` <span class="err" style="display:inline">${esc(r.reason)}</span>`:''}<div class="mu" style="font-size:12px">"${esc(r.quote)}"</div>${r.status==='pending'?`<div class="acts"><button class="btn" onclick="rateReview(${r.id},'approve')">Apply</button><button class="btn r" onclick="rateReview(${r.id},'reject')">Reject</button></div>`:''}</div>`).join('')||'<p class="mu">No rate announcements detected yet.</p>'}
<label>Missed one? Paste the RBI statement text (policy day backup)</label><textarea id="rt_text" rows="4"></textarea><label>Link to the release (optional)</label><input type="text" id="rt_url"><div class="acts"><button class="btn g" onclick="rateProcess()">Extract rates from this text</button></div></details>`:'';
return `<div class="lay">${side}<section class="main"><h2>${esc(cat.name)}<small>${A.si.length} ${A.sst}</small></h2>${due}${rt}${ai}${add}${A.si.map(i=>sCard(cat,i)).join('')||'<p class="mu">Nothing here.</p>'}</section></div>`}
function readS(p,cat){const data={};cat.columns.forEach(k=>data[k]=$(p+'_'+k).value);return{data,source:$(p+'_source').value,as_on:$(p+'_as_on').value,volatility:$(p+'_vol').value}}
async function stAct(id,action){const cat=A.sc.find(c=>c.slug===A.cat),b=action==='delete'?{}:readS(id?'i'+id:'n0',cat);const r=await api('/api/static/item',{action,id,cat:A.cat,...b});if(r.error)alert(r.error);else if(!id)A.sst=action==='create_approved'?'approved':'pending';load()}
async function stApproveAll(){if(!confirm('Approve every pending entry in this category?'))return;const r=await api('/api/static/approve-all',{cat:A.cat});A.msg=`Approved ${r.approved||0}.`;load()}
async function stSeed(){const r=await api('/api/static/seed',{});A.msg=`Added ${r.added||0} starter entries as pending. Verify each before approving.`;A.sst='pending';load()}
function stFile(el){const f=el.files[0];if(f){const rd=new FileReader();rd.onload=()=>{$('csv').value=rd.result};rd.readAsText(f)}}
async function stImport(ap){const r=await api('/api/static/import',{cat:A.cat,csv:$('csv').value,approve:ap});A.msg=r.error||`Added ${r.added}, skipped ${r.skipped} existing.${r.errors&&r.errors.length?' Problems: '+r.errors.slice(0,3).join(' | '):''}`;A.sst=ap?'approved':'pending';load()}
async function stNewCat(){const r=await api('/api/static/cat',{name:$('nc_name').value,kind:$('nc_kind').value,columns:$('nc_cols').value.split(',')});if(r.error)alert(r.error);else{A.cat=r.slug;load()}}
async function stDraft(mode){const b={cat:A.cat,mode};if(mode==='text'){b.text=$('ai_text').value;b.url=$('ai_url').value}else{b.hint=$('ai_hint').value;b.n=+$('ai_n').value||25}A.msg='Working (can take a minute)...';draw();
const r=await api('/api/static/draft',b);A.msg=r.error||`Added ${r.added} as pending, skipped ${r.skipped} duplicates, dropped ${r.dropped}. Review them below.`;A.sst='pending';load()}
async function stFill(){A.msg='Drafting the next batches (about a minute)...';draw();const r=await api('/api/static/fill',{calls:6});
A.msg=r.error||(r.calls?`Drafted ${r.calls} batches: ${r.drafted.join('; ')}. All are PENDING: open each category, check them, then approve.${r.stopped?' Stopped: '+r.stopped:''}`:(r.stopped?'Stopped: '+r.stopped:'Every focus area has been drafted. Use "AI help" inside a category for more.'));A.sst='pending';load()}
async function rateProcess(){A.msg='Reading the statement...';draw();const r=await api('/api/static/rates-process',{text:$('rt_text').value,url:$('rt_url').value});
A.msg=r.error||(r.status==='ignored'?'That text does not state current policy rates.':`Applied ${r.applied.length}, waiting for you ${r.pending.length}, unchanged ${r.unchanged.length}.${r.problems.length?' Problems: '+r.problems.join(' | '):''}`);load()}
async function rateReview(id,action){const r=await api('/api/static/rates-review',{id,action});if(r.error)alert(r.error);load()}
async function stHist(id){const h=await api('/api/static/history?id='+id);alert(h.map(x=>`${x.at}  ${x.note||''}\n  was: ${x.old?JSON.stringify(x.old.data):'(new)'}\n  now: ${JSON.stringify(x.new.data)} [${x.new.status}]`).join('\n\n')||'No history.')}
async function build(){A.msg='Building...';draw();const r=await api('/api/build',{});A.msg=r.error||`Built: ${r.notes} notes, ${r.questions} questions, ${r.editorials} editorials.`;load()}
load();
</script></body></html>
